<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract computational materials field</title>
  <desc id="desc">A geometric network of atoms, bonds and orbital paths.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fffd4" stop-opacity=".42"/>
      <stop offset=".56" stop-color="#20c7a0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#081d21" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bond" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cf0db"/>
      <stop offset="1" stop-color="#ff8a52"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <circle cx="360" cy="360" r="330" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="360" cy="360" rx="258" ry="94" stroke="#92dfcc" stroke-opacity=".34" stroke-width="2" transform="rotate(25 360 360)"/>
    <ellipse cx="360" cy="360" rx="258" ry="94" stroke="#ff9b6d" stroke-opacity=".28" stroke-width="2" transform="rotate(145 360 360)"/>
    <ellipse cx="360" cy="360" rx="190" ry="310" stroke="#92dfcc" stroke-opacity=".22" stroke-width="1.5" transform="rotate(66 360 360)"/>
    <path d="M135 392 254 244 401 218 548 311 573 474 414 564 236 523Z" stroke="url(#bond)" stroke-opacity=".78" stroke-width="3"/>
    <path d="M254 244 323 366 401 218M323 366 548 311M323 366 414 564M323 366 236 523" stroke="#b8f5e7" stroke-opacity=".52" stroke-width="2"/>
  </g>
  <g fill="#07191d" stroke-width="4">
    <circle cx="135" cy="392" r="15" stroke="#ff9b6d"/>
    <circle cx="254" cy="244" r="20" stroke="#8ee5d0"/>
    <circle cx="401" cy="218" r="13" stroke="#ff9b6d"/>
    <circle cx="548" cy="311" r="22" stroke="#8ee5d0"/>
    <circle cx="573" cy="474" r="14" stroke="#ff9b6d"/>
    <circle cx="414" cy="564" r="24" stroke="#8ee5d0"/>
    <circle cx="236" cy="523" r="12" stroke="#ff9b6d"/>
    <circle cx="323" cy="366" r="34" stroke="#d8fff5"/>
  </g>
  <g fill="#d8fff5" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">
    <text x="88" y="371">ρ(r)</text>
    <text x="565" y="286">DFT</text>
    <text x="438" y="601">Ψ</text>
    <text x="286" y="416">E₀</text>
  </g>
  <circle cx="323" cy="366" r="82" fill="#65e6c4" opacity=".12" filter="url(#blur)"/>
</svg>
